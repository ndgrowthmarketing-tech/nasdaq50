<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASDAQ 50 Élő Figyelő</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{darkBg:'#0b0f19',cardBg:'#131c2e',borderCol:'#1f293d'}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
@keyframes fu{0%{background:rgba(16,185,129,.55)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(244,63,94,.55)}100%{background:transparent}}
.flash-up{animation:fu 1.6s ease-out;border-radius:6px;padding:0 4px}.flash-down{animation:fd 1.6s ease-out;border-radius:6px;padding:0 4px}</style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">

<header class="border-b border-borderCol bg-cardBg/90 backdrop-blur-md sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center"><i class="fa-solid fa-chart-line text-white"></i></div>
      <div>
        <h1 class="font-bold text-base sm:text-lg">NASDAQ 50</h1>
        <span id="status" class="text-[11px] text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span id="status-text">Betöltés...</span></span>
      </div>
    </div>
    <button onclick="tick(true)" class="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium flex items-center gap-1.5">
      <i class="fa-solid fa-rotate" id="refresh-icon"></i><span id="countdown">30s</span>
    </button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-8 flex-grow w-full">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-5 mb-6">
    <div class="bg-cardBg border border-borderCol rounded-2xl p-4">
      <div class="text-xs font-semibold text-slate-400 uppercase mb-1">Piaci Hangulat</div>
      <div id="mood" class="text-xl font-bold">Betöltés...</div>
    </div>
    <div class="bg-cardBg border border-borderCol rounded-2xl p-4">
      <div class="text-xs font-semibold text-slate-400 uppercase mb-1">Legnagyobb Növekedés</div>
      <div id="gainer" class="text-lg font-bold text-emerald-400 truncate">-</div>
    </div>
    <div class="bg-cardBg border border-borderCol rounded-2xl p-4">
      <div class="text-xs font-semibold text-slate-400 uppercase mb-1">Legnagyobb Csökkenés</div>
      <div id="loser" class="text-lg font-bold text-rose-400 truncate">-</div>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-5">
    <input id="search" oninput="render()" placeholder="Keresés szimbólum vagy név..." class="w-full sm:w-80 bg-cardBg border border-borderCol rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
    <div class="flex gap-2 w-full sm:w-auto overflow-x-auto">
      <button id="f-all" onclick="setFilter('all')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap">Összes</button>
      <button id="f-gainers" onclick="setFilter('gainers')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap">Nyertesek</button>
      <button id="f-losers" onclick="setFilter('losers')" class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap">Vesztesek</button>
    </div>
  </div>

  <div id="cards" class="grid grid-cols-2 gap-3 md:hidden mb-12"></div>

  <div class="hidden md:block bg-cardBg border border-borderCol rounded-2xl overflow-hidden mb-12">
    <table class="w-full text-left text-sm">
      <thead><tr class="border-b border-borderCol text-xs text-slate-400 uppercase bg-slate-900/40">
        <th class="py-4 px-6">Szimbólum</th><th class="py-4 px-6">Vállalat</th>
        <th class="py-4 px-6 text-right">Árfolyam</th><th class="py-4 px-6 text-right">Változás ($)</th><th class="py-4 px-6 text-right">Változás (%)</th>
      </tr></thead>
      <tbody id="rows" class="divide-y divide-borderCol"></tbody>
    </table>
  </div>
</main>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 bg-black/75 backdrop-blur-sm" onclick="if(event.target===this)closeModal()">
  <div class="bg-slate-900 border border-borderCol w-full max-w-3xl rounded-2xl overflow-hidden flex flex-col max-h-[92vh]">
    <div class="px-4 sm:px-6 py-3.5 border-b border-borderCol flex items-center justify-between bg-cardBg">
      <div class="flex items-center gap-3 truncate">
        <div id="m-badge" class="px-2 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 font-bold flex items-center justify-center text-xs"></div>
        <div class="truncate"><h3 id="m-title" class="font-bold text-white truncate"></h3><span id="m-sub" class="text-xs text-slate-400"></span></div>
      </div>
      <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-4 sm:p-6 space-y-4 overflow-y-auto">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-cardBg border border-borderCol p-3 rounded-xl"><span class="text-xs text-slate-400 block mb-1">Aktuális Ár</span><span id="m-price" class="text-lg font-bold"></span></div>
        <div class="bg-cardBg border border-borderCol p-3 rounded-xl"><span class="text-xs text-slate-400 block mb-1">Napi Változás</span><span id="m-change" class="text-lg font-bold"></span></div>
        <div class="bg-cardBg border border-borderCol p-3 rounded-xl"><span class="text-xs text-slate-400 block mb-1">Napi Nyitás</span><span id="m-open" class="text-sm font-semibold"></span></div>
        <div class="bg-cardBg border border-borderCol p-3 rounded-xl"><span class="text-xs text-slate-400 block mb-1">Előző Záró</span><span id="m-prev" class="text-sm font-semibold"></span></div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-semibold text-slate-400 uppercase">Árfolyam Előzmény <span id="chart-note" class="normal-case text-amber-400"></span></span>
        <div class="flex bg-cardBg border border-borderCol p-1 rounded-xl">
          <button id="tf-1D" onclick="setTf('1D')" class="px-3 py-1.5 rounded-lg text-xs font-semibold">1N</button>
          <button id="tf-1W" onclick="setTf('1W')" class="px-3 py-1.5 rounded-lg text-xs font-semibold">1H</button>
          <button id="tf-1M" onclick="setTf('1M')" class="px-3 py-1.5 rounded-lg text-xs font-semibold">1Hó</button>
          <button id="tf-1Y" onclick="setTf('1Y')" class="px-3 py-1.5 rounded-lg text-xs font-semibold">1Év</button>
        </div>
      </div>
      <div class="bg-cardBg border border-borderCol p-3 rounded-xl relative h-64 sm:h-72"><canvas id="chart"></canvas></div>
    </div>
  </div>
</div>

<script>
const API_KEYS = ["db3v8dpr01qucqgi8nu0db3v8dpr01qucqgi8nug", "db3v8dpr01qucqgi8nu0", "db3v8dpr01qucqgi8nug"]; // a működőt automatikusan kiválasztja
let KEY = API_KEYS[0];
const REFRESH_SEC = 30, PER_TICK = 25;

const LIST = "AAPL:Apple Inc.|MSFT:Microsoft|GOOGL:Alphabet|AMZN:Amazon|NVDA:NVIDIA|META:Meta Platforms|TSLA:Tesla|NFLX:Netflix|AMD:Advanced Micro Devices|INTC:Intel|ADBE:Adobe|CMCSA:Comcast|PEP:PepsiCo|COST:Costco|AVGO:Broadcom|CSCO:Cisco Systems|TMUS:T-Mobile US|QCOM:Qualcomm|TXN:Texas Instruments|AMGN:Amgen|HON:Honeywell|SBUX:Starbucks|INTU:Intuit|ISRG:Intuitive Surgical|GILD:Gilead Sciences|MDLZ:Mondelez|BKNG:Booking Holdings|ADI:Analog Devices|LRCX:Lam Research|VRTX:Vertex Pharma|REGN:Regeneron|PYPL:PayPal|MU:Micron|SNPS:Synopsys|CDNS:Cadence Design|ASML:ASML Holding|CSX:CSX Corp|MAR:Marriott|ORLY:O'Reilly Auto|CTAS:Cintas|MNST:Monster Beverage|MELI:MercadoLibre|KLAC:KLA Corp|PANW:Palo Alto Networks|ABNB:Airbnb|CHTR:Charter Comm.|PDD:PDD Holdings|LULU:Lululemon|ODFL:Old Dominion Freight|NXPI:NXP Semiconductors".split("|");
const stocks = LIST.map(s => { const [symbol, name] = s.split(":"); return {symbol, name, price:null, change:0, pct:0, open:0, prev:0, updated:0}; });
const bySym = Object.fromEntries(stocks.map(s => [s.symbol, s]));

let filter = 'all', tf = '1M', active = null, chart = null, countdown = REFRESH_SEC, busy = false;
const histCache = {};
const $ = id => document.getElementById(id);
const fmt = n => n.toFixed(2);

async function quote(sym) {
  let r;
  try { r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${KEY}`, {signal: AbortSignal.timeout(8000)}); }
  catch (e) { throw 'net'; }
  if (r.status === 429) throw 'rate';
  if (r.status === 401 || r.status === 403) throw 'auth';
  if (!r.ok) throw 'http';
  return r.json();
}

async function pickKey() {
  for (const k of API_KEYS) {
    try {
      const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=AAPL&token=${k}`, {signal: AbortSignal.timeout(8000)});
      if (r.ok) { KEY = k; return true; }
    } catch (e) {}
  }
  return false;
}

async function tick(manual) {
  if (busy) return;
  busy = true; countdown = REFRESH_SEC;
  $('refresh-icon').classList.add('fa-spin');
  // legrégebben frissített részvények (+ a megnyitott)
  let batch = [...stocks].sort((a, b) => a.updated - b.updated).slice(0, PER_TICK);
  if (active && !batch.includes(bySym[active])) batch.push(bySym[active]);
  let rateHit = false, authFail = false, netFail = false, newest = 0;
  for (let i = 0; i < batch.length && !rateHit; i += 5) {
    await Promise.all(batch.slice(i, i + 5).map(async s => {
      try {
        const d = await quote(s.symbol);
        if (d && d.c) {
          if (s.price !== null && d.c !== s.price) { s.flash = d.c > s.price ? 'up' : 'down'; s.flashAt = Date.now(); }
          if (d.t && d.t > newest) newest = d.t;
          s.price = d.c; s.change = d.d || 0; s.pct = d.dp || 0;
          s.open = d.o || d.c; s.prev = d.pc || (d.c - (d.d || 0)); s.updated = Date.now();
        }
      } catch (e) { if (e === 'rate') rateHit = true; if (e === 'auth') authFail = true; if (e === 'net') netFail = true; }
    }));
    render();
  }
  $('refresh-icon').classList.remove('fa-spin');
  const t = new Date().toLocaleTimeString('hu-HU');
  const loaded = stocks.filter(x => x.price !== null).length;
  let msg;
  if (!loaded && authFail) msg = 'Hibás API kulcs (401/403)';
  else if (!loaded && netFail) msg = 'Nincs kapcsolat a Finnhub-bal (hálózat/blokkolás)';
  else if (!loaded && rateHit) msg = 'Kérés-limit elérve, újrapróbálás...';
  else {
    msg = `Frissítve: ${t} · ${loaded}/50 részvény`;
    if (rateHit) msg += ' · limit';
    if (netFail) msg += ' · hálózati hiba';
    msg += marketOpen() ? ' · 🟢 Piac nyitva' : ' · 🔴 Piac zárva (az árak nem változnak)';
    if (newest) msg += ` · utolsó adat: ${new Date(newest * 1000).toLocaleString('hu-HU')}`;
  }
  $('status-text').textContent = msg;
  busy = false;
  if (active) openModalData();
}

function marketOpen() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false}).formatToParts(new Date()).map(x => [x.type, x.value]));
  if (p.weekday === 'Sat' || p.weekday === 'Sun') return false;
  const m = (+p.hour % 24) * 60 + +p.minute;
  return m >= 570 && m < 960;
}
const fl = s => s.flash && Date.now() - s.flashAt < 1600 ? 'flash-' + s.flash : '';

function setFilter(f) { filter = f; render(); }

function render() {
  ['all', 'gainers', 'losers'].forEach(t => {
    $('f-' + t).className = 'px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ' +
      (t === filter ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300');
  });
  const q = $('search').value.toLowerCase();
  let list = stocks.filter(s => s.price !== null && (s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)));
  if (filter === 'gainers') list = list.filter(s => s.change >= 0);
  if (filter === 'losers') list = list.filter(s => s.change < 0);

  const empty = 'Nincs találat / még töltődik...';
  $('cards').innerHTML = list.length ? list.map(s => {
    const pos = s.change >= 0, sg = pos ? '+' : '', c = pos ? 'text-emerald-400' : 'text-rose-400';
    return `<div onclick="openModal('${s.symbol}')" class="bg-cardBg border border-borderCol rounded-2xl p-4 cursor-pointer">
      <div class="flex justify-between mb-2"><span class="px-2 py-0.5 rounded-lg bg-slate-800 text-xs font-bold">${s.symbol}</span>
      <span class="text-[11px] font-bold ${c}">${sg}${fmt(s.pct)}%</span></div>
      <div class="text-xs text-slate-400 truncate mb-2">${s.name}</div>
      <div class="flex justify-between border-t border-slate-800 pt-2"><span class="font-mono font-bold text-sm ${fl(s)}">$${fmt(s.price)}</span><span class="font-mono text-xs ${c}">${sg}${fmt(s.change)}</span></div></div>`;
  }).join('') : `<div class="col-span-full text-center py-10 text-slate-400 text-xs">${empty}</div>`;

  $('rows').innerHTML = list.length ? list.map(s => {
    const pos = s.change >= 0, sg = pos ? '+' : '', c = pos ? 'text-emerald-400' : 'text-rose-400';
    return `<tr onclick="openModal('${s.symbol}')" class="hover:bg-slate-800/50 cursor-pointer">
      <td class="py-3.5 px-6"><span class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs font-bold">${s.symbol}</span></td>
      <td class="py-3.5 px-6 text-slate-200">${s.name}</td>
      <td class="py-3.5 px-6 text-right font-mono font-semibold"><span class="${fl(s)}">$${fmt(s.price)}</span></td>
      <td class="py-3.5 px-6 text-right font-mono font-semibold ${c}">${sg}${fmt(s.change)}</td>
      <td class="py-3.5 px-6 text-right font-bold ${c}">${sg}${fmt(s.pct)}%</td></tr>`;
  }).join('') : `<tr><td colspan="5" class="text-center py-8 text-slate-400">${empty}</td></tr>`;

  const loaded = stocks.filter(s => s.price !== null);
  if (!loaded.length) return;
  const avg = loaded.reduce((a, s) => a + s.pct, 0) / loaded.length;
  const g = loaded.reduce((a, s) => s.pct > a.pct ? s : a), l = loaded.reduce((a, s) => s.pct < a.pct ? s : a);
  $('mood').textContent = `${avg >= 0 ? 'Bika' : 'Medve'} Piac (${avg >= 0 ? '+' : ''}${fmt(avg)}%)`;
  $('mood').className = 'text-xl font-bold ' + (avg >= 0 ? 'text-emerald-400' : 'text-rose-400');
  $('gainer').textContent = `${g.symbol} ${g.pct >= 0 ? '+' : ''}${fmt(g.pct)}%`;
  $('loser').textContent = `${l.symbol} ${fmt(l.pct)}%`;
}

function openModal(sym) {
  active = sym;
  $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
  openModalData(true);
}
function openModalData(redrawChart) {
  const s = bySym[active]; if (!s) return;
  const pos = s.change >= 0, sg = pos ? '+' : '';
  $('m-badge').textContent = s.symbol; $('m-title').textContent = s.name; $('m-sub').textContent = 'NASDAQ: ' + s.symbol;
  $('m-price').textContent = '$' + fmt(s.price);
  $('m-change').textContent = `${sg}${fmt(s.change)} (${sg}${fmt(s.pct)}%)`;
  $('m-change').className = 'text-lg font-bold ' + (pos ? 'text-emerald-400' : 'text-rose-400');
  $('m-open').textContent = '$' + fmt(s.open); $('m-prev').textContent = '$' + fmt(s.prev);
  if (redrawChart) drawChart();
}
function closeModal() {
  $('modal').classList.add('hidden'); $('modal').classList.remove('flex');
  active = null; if (chart) { chart.destroy(); chart = null; }
}
function setTf(t) { tf = t; drawChart(); }

// Valódi történeti adat (Finnhub candle). Ha a csomag nem engedi, szimulált görbe jön.
async function getHistory(s) {
  const key = s.symbol + tf, c = histCache[key];
  if (c && Date.now() - c.t < 120000) return c;
  const now = Math.floor(Date.now() / 1000);
  const cfg = {'1D': ['30', 3 * 86400, 14], '1W': ['60', 8 * 86400, 40], '1M': ['D', 32 * 86400, 22], '1Y': ['W', 366 * 86400, 53]}[tf];
  try {
    const r = await fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${s.symbol}&resolution=${cfg[0]}&from=${now - cfg[1]}&to=${now}&token=${KEY}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    if (d.s !== 'ok' || !d.c || !d.c.length) throw 0;
    const n = Math.min(d.c.length, cfg[2]), off = d.c.length - n;
    const opts = tf === '1D' || tf === '1W' ? {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'} : {year:'2-digit', month:'short', day:'numeric'};
    const out = {t: Date.now(), real: true,
      labels: d.t.slice(off).map(x => new Date(x * 1000).toLocaleString('hu-HU', opts)),
      data: d.c.slice(off)};
    return histCache[key] = out;
  } catch (e) {
    const count = {'1D': 14, '1W': 5, '1M': 20, '1Y': 12}[tf];
    const base = s.price * 0.93, data = [];
    for (let i = 0; i < count; i++) {
      let v = base + i * ((s.price - base) / count) + Math.sin(i * 1.3 + s.price) * s.price * 0.02;
      data.push(+(i === count - 1 ? s.price : v).toFixed(2));
    }
    return {t: Date.now(), real: false, labels: data.map((_, i) => `#${i + 1}`), data};
  }
}

async function drawChart() {
  const s = bySym[active]; if (!s) return;
  ['1D', '1W', '1M', '1Y'].forEach(t => {
    $('tf-' + t).className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition ' +
      (t === tf ? 'text-indigo-400 bg-indigo-600/20' : 'text-slate-400 hover:text-white');
  });
  const h = await getHistory(s);
  if (active !== s.symbol) return;
  $('chart-note').textContent = h.real ? '' : '(szimulált, a valós előzmény nem elérhető)';
  const ctx = $('chart').getContext('2d');
  if (chart) chart.destroy();
  const first = h.data[0], last = h.data[h.data.length - 1], up = last >= first;
  const col = up ? '#10b981' : '#f43f5e';
  const grad = ctx.createLinearGradient(0, 0, 0, 260);
  grad.addColorStop(0, up ? 'rgba(16,185,129,.3)' : 'rgba(244,63,94,.3)'); grad.addColorStop(1, 'rgba(19,28,46,0)');
  chart = new Chart(ctx, {
    type: 'line',
    data: {labels: h.labels, datasets: [{label: s.symbol, data: h.data, borderColor: col, backgroundColor: grad, fill: true, tension: .3, borderWidth: 2, pointRadius: 2}]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}, tooltip: {displayColors: false, callbacks: {label: c => ` Árfolyam: $${c.parsed.y.toFixed(2)}`}}},
      scales: {
        x: {grid: {color: 'rgba(31,41,61,.4)'}, ticks: {color: '#94a3b8', font: {size: 10}, maxTicksLimit: 6}},
        y: {grid: {color: 'rgba(31,41,61,.4)'}, ticks: {color: '#94a3b8', font: {size: 10}, callback: v => '$' + v}}
      }
    }
  });
}

// Indulás: kulcs kiválasztása, első betöltés (mind az 50), majd 30 mp-enként frissítés
(async () => {
  render();
  if (!(await pickKey())) { $('status-text').textContent = 'API kulcs hiba'; }
  await tick();
  setInterval(() => { countdown--; $('countdown').textContent = countdown + 's'; if (countdown <= 0) tick(); }, 1000);
})();
</script>
</body>
</html>
